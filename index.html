<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checking your browser — Cloudflare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #07070f;
      overflow: hidden;
      font-family: 'Unbounded', sans-serif;
    }

    /* ── Orbs ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      transition: transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .orb-1 {
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(246,130,31,0.55) 0%, transparent 60%);
      filter: blur(110px);
      top: -260px; left: -200px;
      animation: b1 9s ease-in-out infinite;
    }
    .orb-2 {
      width: 650px; height: 650px;
      background: radial-gradient(circle, rgba(99,179,237,0.32) 0%, transparent 60%);
      filter: blur(100px);
      bottom: -180px; right: -150px;
      animation: b2 11s ease-in-out infinite;
    }
    .orb-3 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(139,92,246,0.32) 0%, transparent 60%);
      filter: blur(90px);
      top: 30%; left: 45%;
      animation: b3 13s ease-in-out infinite;
    }
    .orb-4 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(246,130,31,0.25) 0%, transparent 60%);
      filter: blur(80px);
      bottom: 10%; left: 5%;
      animation: b2 8s ease-in-out infinite reverse;
    }
    .orb-5 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(236,72,153,0.2) 0%, transparent 60%);
      filter: blur(80px);
      top: 10%; right: 15%;
      animation: b1 14s ease-in-out infinite reverse;
    }

    @keyframes b1 {
      0%,100% { transform: scale(1) translate(0,0); }
      50%      { transform: scale(1.12) translate(35px,-25px); }
    }
    @keyframes b2 {
      0%,100% { transform: scale(1) translate(0,0); }
      50%      { transform: scale(1.09) translate(-25px,20px); }
    }
    @keyframes b3 {
      0%,100% { transform: scale(1) translate(0,0); }
      50%      { transform: scale(1.15) translate(20px,30px); }
    }

    /* Grid */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(7,7,15,0.75) 100%);
    }

    /* ── Particles ── */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .p {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      8%   { opacity: 0.8; }
      88%  { opacity: 0.1; }
      100% { opacity: 0; transform: translateY(-105vh) scale(0.2); }
    }

    /* ── Center content ── */
    .center {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
    }

    /* CF logo */
    .cf-logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeUp 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }
    .cf-logo-wrap svg { width: 32px; height: 32px; }
    .cf-brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
    }

    /* Main text */
    .main-text {
      text-align: center;
      animation: fadeUp 0.8s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }

    .main-text h1 {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff 0%, rgba(246,130,31,0.9) 60%, rgba(251,173,65,0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .main-text p {
      margin-top: 12px;
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
    }

    /* Spinner */
    .spinner-wrap {
      animation: fadeUp 0.8s 0.2s cubic-bezier(0.22,1,0.36,1) both;
    }

    .ring {
      position: relative;
      width: 56px; height: 56px;
    }

    .ring svg {
      width: 100%; height: 100%;
    }

    .ring .track { stroke: rgba(255,255,255,0.06); }
    .ring .arc {
      stroke: #f6821f;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(246,130,31,0.9));
      stroke-dasharray: 100 180;
      transform-origin: center;
      animation: spin 1.4s cubic-bezier(0.4,0,0.2,1) infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .ring-dot {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f6821f;
      box-shadow: 0 0 10px #f6821f, 0 0 22px rgba(246,130,31,0.5);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
      50%      { transform: translate(-50%,-50%) scale(1.6); opacity: 0.4; }
    }

    /* Progress bar */
    .bar-wrap {
      width: min(320px, 80vw);
      animation: fadeUp 0.8s 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }

    .bar-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 8px;
    }

    .bar-track {
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #f6821f, #fbad41);
      box-shadow: 0 0 8px rgba(246,130,31,0.6);
      transition: width 0.55s cubic-bezier(0.4,0,0.2,1);
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      align-items: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
      z-index: 2;
      animation: fadeUp 0.8s 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }

    .ray {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 9px;
      color: rgba(255,255,255,0.12);
    }

    .captcha-wrap {
      animation: fadeUp 0.8s 0.4s cubic-bezier(0.22,1,0.36,1) both;
      display: flex;
      justify-content: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  <div class="orb orb-5"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
</div>

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- Content -->
<div class="center">

  <div class="cf-logo-wrap">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M72.5 57.5C73.8 53.2 73.3 49.3 71 46.3C68.9 43.6 65.7 42 62.2 41.8L61.4 41.7C60.3 37.1 57.5 33.1 53.5 30.5C49.5 27.9 44.7 27 40 28C35.3 29 31.3 31.7 28.7 35.6C26.1 39.5 25.1 44.2 26 48.8L26.1 49.3L25.6 49.3C22.5 49.5 19.6 50.9 17.6 53.2C15.6 55.5 14.7 58.5 15.1 61.5C15.9 67.5 21.3 71.8 27.4 71.5H71.1C74.1 71.5 76.8 69.8 78.1 67.1C79.4 64.4 79 61.2 77.1 58.9L72.5 57.5Z" fill="#F6821F"/>
      <path d="M72.5 57.5L71.1 57.1C71.3 56.3 71.4 55.5 71.4 54.7C71.4 50.1 67.7 46.3 63.1 46.3C62.8 46.3 62.5 46.3 62.2 46.4L61.4 41.7C65.7 42 68.9 43.6 71 46.3C73.3 49.3 73.8 53.2 72.5 57.5Z" fill="#FBAD41"/>
    </svg>
    <span class="cf-brand">Cloudflare</span>
  </div>

  <div class="main-text">
    <h1 id="headline">Checking your<br>browser…</h1>
    <p id="subline">Please wait while we verify your connection</p>
  </div>

  <div class="spinner-wrap">
    <div class="ring" id="ring">
      <svg viewBox="0 0 56 56">
        <circle class="track" cx="28" cy="28" r="23" stroke-width="2" fill="none"/>
        <circle class="arc"   cx="28" cy="28" r="23" stroke-width="2" fill="none"/>
      </svg>
      <div class="ring-dot"></div>
    </div>
  </div>

  <div class="bar-wrap">
    <div class="bar-meta">
      <span>Verification</span>
      <span id="pct">0%</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

  <div class="captcha-wrap">
    ::CAPTCHA_BOX::
  </div>

</div>

<!-- Footer -->
<div class="footer">
  <span class="ray" id="rayId">—</span>
  <span>·</span>
  <span>Performance &amp; security by Cloudflare</span>
</div>

<script>
  /* Particles */
  const wrap = document.getElementById('particles');
  const colors = ['#f6821f','#fbad41','#63b3ed','#a78bfa','#f472b6'];
  for (let i = 0; i < 35; i++) {
    const el = document.createElement('div');
    el.className = 'p';
    const s = Math.random() * 2.5 + 0.6;
    el.style.cssText = `
      width:${s}px;height:${s}px;
      left:${Math.random()*100}vw;
      bottom:-6px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${Math.random()*14+7}s;
      animation-delay:-${Math.random()*18}s;
    `;
    wrap.appendChild(el);
  }

  /* Ray ID */
  const h = '0123456789abcdef';
  let rid = '';
  for (let i = 0; i < 16; i++) rid += h[Math.floor(Math.random()*16)];
  document.getElementById('rayId').textContent = 'Ray ID: ' + rid;

  /* Progress */
  const bar = document.getElementById('barFill');
  const pct = document.getElementById('pct');
  const setP = v => { bar.style.width = v+'%'; pct.textContent = v+'%'; };

  setTimeout(() => setP(30), 600);
  setTimeout(() => setP(60), 1500);
  setTimeout(() => setP(85), 2400);
  setTimeout(() => setP(100), 3200);
  setTimeout(() => {
    document.getElementById('headline').innerHTML = 'Verification<br>complete';
    document.getElementById('subline').textContent = 'Redirecting you now…';
    document.getElementById('ring').style.opacity = '0';
    document.getElementById('ring').style.transition = 'opacity 0.4s';
  }, 3700);

  /* Mouse parallax */
  const orbs = document.querySelectorAll('.orb');
  document.addEventListener('mousemove', e => {
    const dx = (e.clientX / window.innerWidth  - 0.5);
    const dy = (e.clientY / window.innerHeight - 0.5);
    orbs.forEach((o, i) => {
      const f = (i + 1) * 16;
      o.style.transform = `translate(${dx*f}px,${dy*f}px)`;
    });
  });
</script>
</body>
</html>
