<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checking your browser — Cloudflare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #07070f;
      overflow: hidden;
      font-family: 'Unbounded', sans-serif;
    }

    /* ── Orbs ── */
    .bg { position: fixed; inset: 0; z-index: 0; }

    .orb {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      transition: transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .o1 {
      width: 750px; height: 750px;
      background: radial-gradient(circle, rgba(246,130,31,0.55) 0%, transparent 60%);
      filter: blur(110px);
      top: -260px; left: -180px;
      animation: b1 9s ease-in-out infinite;
    }
    .o2 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(99,179,237,0.3) 0%, transparent 60%);
      filter: blur(100px);
      bottom: -160px; right: -130px;
      animation: b2 11s ease-in-out infinite;
    }
    .o3 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(139,92,246,0.3) 0%, transparent 60%);
      filter: blur(90px);
      top: 30%; left: 48%;
      animation: b3 13s ease-in-out infinite;
    }
    .o4 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(246,130,31,0.22) 0%, transparent 60%);
      filter: blur(80px);
      bottom: 12%; left: 6%;
      animation: b2 8s ease-in-out infinite reverse;
    }
    .o5 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(236,72,153,0.2) 0%, transparent 60%);
      filter: blur(80px);
      top: 8%; right: 12%;
      animation: b1 14s ease-in-out infinite reverse;
    }

    @keyframes b1 {
      0%,100% { transform: scale(1) translate(0,0); }
      50%      { transform: scale(1.12) translate(35px,-25px); }
    }
    @keyframes b2 {
      0%,100% { transform: scale(1) translate(0,0); }
      50%      { transform: scale(1.09) translate(-25px,20px); }
    }
    @keyframes b3 {
      0%,100% { transform: scale(1) translate(0,0); }
      50%      { transform: scale(1.15) translate(20px,30px); }
    }

    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(7,7,15,0.8) 100%);
    }

    /* ── Particles ── */
    .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .p {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      8%   { opacity: 0.7; }
      88%  { opacity: 0.1; }
      100% { opacity: 0; transform: translateY(-105vh) scale(0.2); }
    }

    /* ── Center ── */
    .center {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
    }

    /* Logo */
    .logo {
      display: flex; align-items: center; gap: 10px;
      animation: up 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }
    .logo svg { width: 30px; height: 30px; }
    .logo span {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* Headline */
    .headline {
      text-align: center;
      animation: up 0.8s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }
    .headline h1 {
      font-size: clamp(26px, 4.5vw, 48px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      background: linear-gradient(135deg, #fff 0%, rgba(246,130,31,0.9) 65%, #fbad41 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .headline p {
      margin-top: 10px;
      font-size: clamp(10px, 1.3vw, 12px);
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    /* Captcha box */
    .captcha {
      animation: up 0.8s 0.2s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    .footer {
      position: fixed; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: center;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: rgba(255,255,255,0.13);
      z-index: 2;
      animation: up 0.8s 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
  </style>
</head>
<body>

<div class="bg">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="orb o4"></div>
  <div class="orb o5"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
</div>

<div class="particles" id="pts"></div>

<div class="center">

  <div class="logo">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M72.5 57.5C73.8 53.2 73.3 49.3 71 46.3C68.9 43.6 65.7 42 62.2 41.8L61.4 41.7C60.3 37.1 57.5 33.1 53.5 30.5C49.5 27.9 44.7 27 40 28C35.3 29 31.3 31.7 28.7 35.6C26.1 39.5 25.1 44.2 26 48.8L26.1 49.3L25.6 49.3C22.5 49.5 19.6 50.9 17.6 53.2C15.6 55.5 14.7 58.5 15.1 61.5C15.9 67.5 21.3 71.8 27.4 71.5H71.1C74.1 71.5 76.8 69.8 78.1 67.1C79.4 64.4 79 61.2 77.1 58.9L72.5 57.5Z" fill="#F6821F"/>
      <path d="M72.5 57.5L71.1 57.1C71.3 56.3 71.4 55.5 71.4 54.7C71.4 50.1 67.7 46.3 63.1 46.3C62.8 46.3 62.5 46.3 62.2 46.4L61.4 41.7C65.7 42 68.9 43.6 71 46.3C73.3 49.3 73.8 53.2 72.5 57.5Z" fill="#FBAD41"/>
    </svg>
    <span>Cloudflare</span>
  </div>

  <div class="headline">
    <h1>Checking your<br>browser…</h1>
    <p>Verifying you are human</p>
  </div>

  <div class="captcha">::CAPTCHA_BOX::</div>

</div>

<div class="footer">Performance &amp; security by Cloudflare</div>

<script>
  const pts = document.getElementById('pts');
  const colors = ['#f6821f','#fbad41','#63b3ed','#a78bfa','#f472b6'];
  for (let i = 0; i < 32; i++) {
    const el = document.createElement('div');
    el.className = 'p';
    const s = Math.random() * 2.5 + 0.6;
    el.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}vw;bottom:-6px;background:${colors[Math.floor(Math.random()*5)]};animation-duration:${Math.random()*14+7}s;animation-delay:-${Math.random()*18}s;`;
    pts.appendChild(el);
  }

  const orbs = document.querySelectorAll('.orb');
  document.addEventListener('mousemove', e => {
    const dx = e.clientX / window.innerWidth  - 0.5;
    const dy = e.clientY / window.innerHeight - 0.5;
    orbs.forEach((o, i) => {
      const f = (i + 1) * 16;
      o.style.transform = `translate(${dx*f}px,${dy*f}px)`;
    });
  });
</script>
</body>
</html>
